; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = platformio-override.ini
default_envs = complete

[env]
board_build.flash_mode = qio
board_build.bootloader = dio
; The esp-wrover-kit board manifest defaults to 40 MHz and esptool stamps that
; into the bootloader header, which is what the 2nd-stage bootloader actually
; clocks the flash with — sdkconfig (80 MHz flash + 80 MHz PSRAM) never applied.
; Running flash at 40 MHz starves the memory-bound audio path and made playback
; stutter whenever the webserver pushed big transfers over the shared SPI bus.
board_build.f_flash = 80000000L
board_build.partitions = custom_16mb_ota.csv
;platform = espressif32@^6.10.0 ; Arduino 2.0.17 (ESP-IDF 4.4.7)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip ; Arduino 3.3.9 (ESP-IDF 5.5.4)
;framework = arduino
framework = arduino, espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder ; you can use ESP Decoder from VSC-Extension instead
;monitor_port = /dev/cu.SLAB_USBtoUART
;upload_port = /dev/cu.SLAB_USBtoUART
;upload_speed = 115200
extra_scripts =
    pre:install_dependencies.py
    pre:gitVersion.py
    pre:platformInfo.py
    pre:updateSdkConfig.py
    pre:processHtml.py
    pre:patchAudioLib.py
lib_deps =
	https://github.com/Joe91/ESP32-audioI2S.git#3c2a6b804afcb796fdefc755570ac28f6198d5e5 ;v3.4.7h
	https://github.com/madhephaestus/ESP32Encoder.git#7501cb47ec702c43de3c64df56d0b10930b9bc70 ; v0.12.0
	; ESP-FTP-Server-Lib vendored in lib/ (based on Joe91/ESP-FTP-Server-Lib@517a2c9) - patched to accept any FTP username (password-only auth)
	https://github.com/FastLED/FastLED.git#20667c3a6413ed46a828f78ec95fb57e58d753f8 ; v3.10.3
	; AsyncTCP must be listed BEFORE ESPAsyncWebServer: otherwise its transitive registry
	; dependency wins and installs the latest release instead of this pin.
	esp32async/AsyncTCP@3.4.10 ; exact pin (no ^/git-hash: both get re-resolved to the newest release) - the unpinned jump to 3.5.0 cost ~10 KB internal heap and reboot-looped the complete board (HomeSpan mDNS OOM)
	https://github.com/ESP32Async/ESPAsyncWebServer.git#d6aa7daf0823a41966b1841826cff015237d6e42 ; v3.11.1
	https://github.com/bblanchon/ArduinoJson.git#77771d3c07668e01d8f52acb03910c1110bb373f ; v7.4.3
	https://github.com/pschatzmann/arduino-audio-tools.git#b4b32dc849233e1c51424221951c9f5c576671e5 ; v1.2.4
	https://github.com/pschatzmann/ESP32-A2DP.git#b6da4744286ca15b6f1dee607c077a4747294dd4 ; v1.8.11
	https://github.com/Arduino-IRremote/Arduino-IRremote.git#498dc591b255d8ba2e239c875804bdab2ab0fe91 ; v4.7.1
	https://github.com/Joe91/MFRC522_I2C.git#3cabf223fb6b2950474ff41f70c28922f8551341
	https://github.com/tueddy/rfid.git#caa3e6d4f9cc592e800b4467d61d64f765c3156f ; avoid warnings, fork from https://github.com/miguelbalboa/rfid.git#0ff12a1
	https://github.com/tuniii/LogRingBuffer.git#89d7d3e5b74e773cae38345e23ddaf2c4fd3e367
	; PN5180 vendored in lib/ (based on tueddy/PN5180-Library@69ec032) with fast no-card detection in activateTypeA
	https://github.com/tueddy/natsort.git#ebbf6604c573c5315daa8fa77da8f047f202bd63 ; avoid warnings, fork from https://github.com/sourcefrog/natsort.git#cdd8df9
	olikraus/U8g2@^2.35.9 ; OLED display (SH1106/SSD1306), only compiled when OLED_ENABLE is set
	adafruit/RTClib@^2.1.4 ; battery-backed RTC (DS3231), only compiled when RTC_ENABLE is set
	https://github.com/HomeSpan/HomeSpan.git ; Apple HomeKit accessory (control + Siri), only compiled when HOMEKIT_ENABLE is set

board_build.embed_txtfiles =
    managed_components/espressif__esp_insights/server_certs/https_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt

build_flags =
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_USE_WDT=1
    ; AsyncTCP >= 3.5.0 defaults the async_tcp task stack to 16 KB. The complete board's internal
    ; heap is too tight/fragmented for that at webserver start, so task creation fails silently and
    ; port 80 never listens ("failed to start task"). 8 KB was the long-standing default and is proven.
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
    -DCORE_DEBUG_LEVEL=0 ;6
    -DCONFIG_FATFS_USE_LABEL=1 ; enable sd card volume label support
    -DENABLE_FTP_SANITIZATION
    -std=c++17
    -std=gnu++17
    -Wall
    -Wextra
    -Wunreachable-code

build_unflags =
    -std=gnu++11
    -Werror=all

; This fork is developed and shipped on the "complete" board (see CLAUDE.md);
; the environments below are the upstream ESPuino boards, kept here so the
; firmware can still be built for other hardware if someone wants to run it.
[env:complete]
;https://docs.platformio.org/en/latest/boards/espressif32/esp-wrover-kit.html
board = esp-wrover-kit
board_build.partitions = custom_16mb_ota.csv
build_flags = ${env.build_flags}
              -DHAL=6
              -DBOARD_HAS_PSRAM
              ; -mfix-esp32-psram-cache-issue intentionally dropped: it works around a
              ; silicon bug of ESP32 rev1 that this image can't run on anyway (bootloader
              ; enforces rev >= 3). The workaround bloats and slows all PSRAM-touching
              ; code - measurable overhead in the memory-bound audio decode path.
              -DLOG_BUFFER_SIZE=10240
              -DBOARD_HAS_16MB_FLASH_AND_OTA_SUPPORT
board_upload.maximum_size = 16777216
board_upload.flash_size = 16MB

[env:lolin_d32_pro]
;https://docs.platformio.org/en/latest/boards/espressif32/lolin_d32_pro.html
board = lolin_d32_pro
board_build.partitions = custom_16mb_ota.csv
build_flags = ${env.build_flags}
              -DHAL=4
              -DBOARD_HAS_PSRAM
              -mfix-esp32-psram-cache-issue
              -DLOG_BUFFER_SIZE=10240
              -DBOARD_HAS_16MB_FLASH_AND_OTA_SUPPORT
board_upload.maximum_size = 16777216
board_upload.flash_size = 16MB

[env:lolin_d32_pro_sdmmc_pe]
;https://docs.platformio.org/en/latest/boards/espressif32/lolin_d32_pro.html
board = lolin_d32_pro
board_build.partitions = custom_16mb_ota.csv
build_flags = ${env.build_flags}
              -DHAL=7
              -DBOARD_HAS_PSRAM
              -mfix-esp32-psram-cache-issue
              -DLOG_BUFFER_SIZE=10240
              -DBOARD_HAS_16MB_FLASH_AND_OTA_SUPPORT
board_upload.maximum_size = 16777216
board_upload.flash_size = 16MB

[env:ttgo_t8]
;https://docs.platformio.org/en/latest/boards/espressif32/esp-wrover-kit.html
board = esp-wrover-kit
board_build.partitions = custom_4mb_noota.csv
build_flags = ${env.build_flags}
              -DHAL=5
              -DBOARD_HAS_PSRAM
              -mfix-esp32-psram-cache-issue
              -DLOG_BUFFER_SIZE=10240

; custom board based on 8 MB flash devkitc
[env:esp32-wrover-devkitc-v4-8mb]
;https://docs.platformio.org/en/latest/boards/espressif32/esp-wrover-kit.html
board = esp-wrover-kit
board_build.partitions = custom_8mb_ota.csv
build_flags = ${env.build_flags}
              -DHAL=99
              -DBOARD_HAS_PSRAM
              -mfix-esp32-psram-cache-issue
              -DLOG_BUFFER_SIZE=10240
              -DBOARD_HAS_16MB_FLASH_AND_OTA_SUPPORT ; 8MB is fine
board_upload.maximum_size = 8388608
board_upload.flash_size = 8MB

[env:esp32-s3-devkitc-1]
;https://docs.platformio.org/en/latest/boards/espressif32/esp32-s3-devkitc-1.html
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.partitions = custom_4mb_noota.csv
build_flags = ${env.build_flags}
              -DHAL=99
              -DLOG_BUFFER_SIZE=10240
