# LEO INDUSTRIES AT-1 (ESPuino) behind SWAG — https://at1.<your-domain>
#
# Install: copy to /config/nginx/proxy-confs/at1.subdomain.conf inside the SWAG
# container (DNS for at1.<domain> must resolve to the SWAG host) and restart SWAG.
#
# Why HTTPS matters here: service workers only run in a secure context, so the
# PWA's offline page ("Box schläft") never worked over plain http://<ip>. Served
# through this proxy, the service worker registers, and when the device is
# asleep the app shows the offline page instead of a black screen (the firmware
# treats the proxy's 502/504 as offline — see html/sw.js).
#
# Re-add the PWA to the home screen from https://at1.<domain>/ once — the old
# icon added from http://<ip> keeps its old origin and gains nothing.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name at1.*;

    include /config/nginx/ssl.conf;

    # SD-card uploads through the web UI can be arbitrarily large
    client_max_body_size 0;

    location / {
        # proxy.conf brings the websocket upgrade headers the /ws live UI needs
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app 192.168.1.34;
        set $upstream_port 80;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        # uploads / GitHub-OTA runs take minutes; don't cut them off
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # let large downloads/uploads stream instead of buffering on the proxy
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

