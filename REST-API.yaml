openapi: 3.0.0
info:
  title: ESPuino API
  version: 1.0.5
  description: >-
    API for the ESPuino, a DIY Smart Speaker project. ESPuino is a DIY Smart
    Speaker that uses software-based audio decoding, supports various music
    sources, and offers a user-friendly web interface. It simplifies audio
    processing and enhances user feedback with Neopixel rings.
servers:
  - url: /
    description: Local Device
  - url: "http://espuino.local/"
    description: Development ESPuino
# When a web password is set, every endpoint (except /login and a few PWA assets)
# requires authentication. Two options:
#   * API key (easiest for scripts/curl): send the web password via the "X-API-Key"
#     header, e.g. `curl -H "X-API-Key: <pw>" ...`.
#   * Session cookie: POST the password to /login (body {"password":"..."}) to get the
#     ESPUINO_SESSION cookie (used automatically by the browser/Swagger UI).
# With no web password set, the API is open and authentication is ignored.
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'Web password sent as an API key in the X-API-Key header.'
    cookieAuth:
      type: apiKey
      in: cookie
      name: ESPUINO_SESSION
      description: 'Session cookie obtained from POST /login.'
security:
  - apiKey: []
  - cookieAuth: []
paths:
  /explorer:
    get:
      summary: List the contents of a directory.
      description: Get a list of files and directories in the specified path.
      parameters:
        - in: query
          name: path
          schema:
            type: string
            default: /
          description: Path to the directory to be listed.
      responses:
        "200":
          description: Directory content successfully listed.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    dir:
                      type: boolean
                      description: >-
                        True if item is a directory. This parameter is omitted
                        for a file.
    post:
      summary: Upload a file.
      description: >-
        Uploads a single file, given as a raw binary body (not multipart/
        form-data). To upload several files, send one request per file.
      parameters:
        - in: query
          name: path
          schema:
            type: string
          description: Full target path, including the filename, to upload the file to.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: File successfully uploaded.
    delete:
      summary: Delete a file or directory.
      description: Delete a file or directory in the specified path.
      parameters:
        - in: query
          name: path
          schema:
            type: string
          description: Path to the file or directory to be deleted.
      responses:
        "200":
          description: File or directory successfully deleted.
    put:
      summary: Create a new directory.
      description: Create a new directory in the specified path.
      parameters:
        - in: query
          name: path
          schema:
            type: string
          description: Path for the new directory to be created.
      responses:
        "200":
          description: Directory successfully created.
    patch:
      summary: Rename a file.
      description: Rename a file from the source path to the destination path.
      parameters:
        - in: query
          name: srcpath
          schema:
            type: string
          description: Current path of the file to be renamed.
        - in: query
          name: dstpath
          schema:
            type: string
          description: New path for the file.
      responses:
        "200":
          description: File successfully renamed.
  /exploreraudio:
    post:
      summary: Play an audio file.
      description: Play an audio file specified by the path.
      parameters:
        - in: query
          name: path
          schema:
            type: string
          description: Path to the audio file or directory.
        - in: query
          name: playmode
          schema:
            type: string
          description: Play mode for audio.
      responses:
        "200":
          description: Successful audio play.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /explorerdownload:
    get:
      summary: Download a file.
      description: Download a file specified by the path.
      parameters:
        - in: query
          name: path
          schema:
            type: string
          description: Path of the file to download.
      responses:
        "200":
          description: Successful download.
  /savedSSIDs:
    get:
      summary: Get a list of saved networks.
      description: Get a list of saved Wi-Fi networks.
      responses:
        "200":
          description: Successful response with saved networks.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
    post:
      summary: Save a new network.
      description: Save a new Wi-Fi network.
      requestBody:
        description: Network details to save.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                SSID:
                  type: string
                pwd:
                  type: string
                static:
                  type: boolean
                static_addr:
                  type: string
                static_gateway:
                  type: string
                static_subnet:
                  type: string
                static_dns1:
                  type: string
                static_dns2:
                  type: string
              required:
                - SSID
                - pwd
      responses:
        "200":
          description: Successful network save.
    delete:
      summary: Delete a saved network.
      description: Delete a saved Wi-Fi network by SSID.
      parameters:
        - in: query
          name: ssid
          schema:
            type: string
          description: SSID of the network to delete.
      responses:
        "200":
          description: Successful network deletion.
  /activeSSID:
    get:
      summary: Get the current active network name.
      description: Get the SSID of the currently active network.
      responses:
        "200":
          description: Successful response with active network name.
          content:
            application/json:
              schema:
                type: string
  /wificonfig:
    get:
      summary: Get current common Wi-Fi configuration.
      description: Get the current common Wi-Fi configuration settings.
      responses:
        "200":
          description: Successful response with Wi-Fi configuration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  hostname:
                    type: string
                  ScanWiFiOnStart:
                    type: boolean
    post:
      summary: Save common Wi-Fi configuration (partial updates allowed).
      description: >
        Save the common Wi-Fi configuration. Partial updates are supported: send only
        "hostname" (saved from the General tab) or only "scanOnStart" (from the WiFi tab);
        omitted fields are left unchanged.
      requestBody:
        description: Common Wi-Fi configuration to save (any subset of the fields).
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hostname:
                  type: string
                scanOnStart:
                  type: boolean
      responses:
        "200":
          description: Successful Wi-Fi configuration save.
  /mode:
    get:
      summary: Get current operation mode.
      description: Get the current operation mode of the device (Normal, Bluetooth Sink, or Bluetooth Source).
      responses:
        "200":
          description: Successful response with current operation mode.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode:
                    type: integer
                    description: >-
                      Operation mode: 0 = Normal, 1 = Bluetooth Sink, 2 = Bluetooth Source
                    enum:
                      - 0
                      - 1
                      - 2
    post:
      summary: Set operation mode.
      description: >-
        Set the operation mode of the device. The device will restart immediately after receiving this request.
        Note: The HTTP response may not be received as the device restarts before sending it.
        The client should display a restart notification immediately after sending this request.
      requestBody:
        description: Operation mode to set.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: integer
                  description: >-
                    Operation mode: 0 = Normal, 1 = Bluetooth Sink, 2 = Bluetooth Source
                  enum:
                    - 0
                    - 1
                    - 2
              required:
                - mode
      responses:
        "200":
          description: Operation mode change accepted (device restarts immediately - response may not be received).
        "400":
          description: Bad request - missing or invalid 'mode' parameter.
  /settings:
    get:
      summary: Get common settings.
      description: "Get common settings, optionally for a specific section."
      parameters:
        - in: query
          name: section
          schema:
            type: string
          description: Optional section to retrieve specific settings.
      responses:
        "200":
          description: Successful response with common settings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  # Include your common settings properties here.
                  {}
    post:
      summary: Save settings.
      description: Save common settings.
      requestBody:
        description: Settings to save.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                general:
                  type: object
                  # Include all general settings properties here
                defaults:
                  type: object
                  # Include all defaults settings properties here
                wifi:
                  type: object
                  # Include all Wi-Fi settings properties here
                led:
                  type: object
                  # Include all LED settings properties here
                oled:
                  type: object
                  properties:
                    shutdownSeconds:
                      type: integer
                      minimum: 0
                      maximum: 30
                      default: 3
                      description: Cancellable OLED shutdown countdown in seconds; 0 shuts down immediately.
                    menuTimeout:
                      type: integer
                      minimum: 1
                      maximum: 30
                      default: 5
                      description: OLED quick-menu inactivity timeout in seconds.
                    menuRemember:
                      type: boolean
                      default: false
                      description: Remember the last OLED quick-menu selection when reopening it.
                    menuItems:
                      type: string
                      default: status,ip,battery,sysinfo,equalizer,nightmode,webdav,fwupdate,shutdown
                      description: >-
                        Ordered OLED quick-menu item IDs. Prefix an item with "-" to keep its
                        position while hiding it. At least one known item must remain enabled.
                battery:
                  type: object
                  # Include all battery settings properties here
                ftp:
                  type: object
                  # Include all FTP settings properties here
                mqtt:
                  type: object
                  # Include all MQTT settings properties here
                bluetooth:
                  type: object
                  # Include all Bluetooth settings properties here
              required:
                - general
      responses:
        "200":
          description: Successful settings save.
  /rfid:
    get:
      summary: List all saved RFID-tag assignments with details.
      description: >-
        Get a list of saved RFID-tag assignments with details. Optionally,
        provide an ID to list only a single assignment.
      parameters:
        - in: query
          name: id
          schema:
            type: string
          description: Optional ID to list only a single assignment.
      responses:
        "200":
          description: Successful response with RFID-tag assignments.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  # Include your RFID-tag assignment properties here.
                  additionalProperties: true
        "404":
          description: The requested RFID tag ID does not exist.
    post:
      summary: Save or overwrite RFID-tag assignment.
      description: Save a new RFID-tag assignment or overwrite an existing one.
      requestBody:
        description: RFID-tag assignment details to save.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                fileOrUrl:
                  type: string
                modId:
                  type: string
                playMode:
                  type: string
              required:
                - id
                - fileOrUrl
      responses:
        "200":
          description: Successful RFID-tag assignment save.
        "400":
          description: The serialized assignment exceeds the device's supported length.
    delete:
      summary: Delete an RFID-tag assignment.
      description: Delete an RFID-tag assignment by providing its ID.
      parameters:
        - in: query
          name: id
          schema:
            type: string
          description: ID of the RFID-tag assignment to delete.
      responses:
        "200":
          description: Successful RFID-tag assignment deletion.
  /rfidresetpos:
    post:
      tags: [Fork]
      summary: Reset an audiobook tag's saved play-position.
      description: >
        Resets the saved play-position and last-played track of a tag back to the start
        (preserving the folder/file and play mode), so a finished or abandoned audiobook
        can be restarted from the beginning without re-assigning the card.
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
          description: RFID tag id.
      responses:
        "200":
          description: Position reset.
        "400":
          description: Missing id.
        "404":
          description: Unknown tag.
        "409":
          description: Tag has no play-position (NO_PLAYLIST or a modification card).
  /rfid/ids-only:
    get:
      summary: Get an array of RFID tag ID names.
      description: Returns an array of RFID tag IDs without additional details.
      responses:
        "200":
          description: Successful response with RFID tag IDs.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /cover:
    get:
      summary: Get album cover image.
      description: Handle album cover image requests and serve the current cover art image.
      responses:
        "200":
          description: Successful response with album cover image.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
  /logo:
    get:
      summary: Get the ESPuino logo.
      description: >-
        Serves the logo embedded in the firmware/SD-card (PNG or SVG,
        whichever is present). Used instead of an external redirect so it
        still works without internet access, e.g. in AP setup mode.
      responses:
        "200":
          description: Successful response with the logo image.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
  /wifistatus:
    get:
      summary: Get current Wi-Fi connection status.
      description: >-
        Returns the current connection state, the last connection failure (if
        any), and the state of an in-progress live connection test started via
        POST /wifitest (used by the AP setup page).
      responses:
        "200":
          description: Successful response with Wi-Fi status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    type: integer
                    description: Current Wi-Fi connection state.
                  ssid:
                    type: string
                    description: SSID of the currently connected network (only present while connected).
                  ip:
                    type: string
                    description: Current IP address (only present while connected).
                  last_failure:
                    type: object
                    description: Details of the most recent failed connection attempt, if any.
                    properties:
                      ssid:
                        type: string
                      reason:
                        type: integer
                        description: Raw ESP-IDF Wi-Fi disconnect reason code.
                      class:
                        type: string
                        description: >-
                          Classified reason: wrong_password, not_found,
                          rejected, timeout, or other.
                  test:
                    type: object
                    description: Present only while a live connection test (POST /wifitest) is in progress or has just finished.
                    properties:
                      phase:
                        type: string
                        enum:
                          - connecting
                          - success
                          - failed
                      ssid:
                        type: string
                      ip:
                        type: string
                        description: Only present when phase is "success".
                      reason:
                        type: integer
                        description: Only present when phase is "failed".
                      class:
                        type: string
                        description: Only present when phase is "failed". Same classification as last_failure.class.
  /wifitest:
    post:
      summary: Start a live Wi-Fi connection test.
      description: >-
        Starts testing the given (already-saved via POST /savedSSIDs)
        network's credentials in the background while staying in AP mode, so
        the setup page can show success/failure without a save-reboot-hope
        cycle. Poll GET /wifistatus for the result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ssid:
                  type: string
              required:
                - ssid
      responses:
        "200":
          description: Test started.
        "400":
          description: Missing/invalid SSID, or the network isn't saved yet.
  /bluetoothscan:
    get:
      summary: Start a Bluetooth device scan.
      description: >-
        Starts scanning for nearby Bluetooth devices. Only available in
        Bluetooth source mode. Results are retrieved via GET /bluetoothresults.
      responses:
        "200":
          description: Scan started.
        "400":
          description: Bluetooth source mode not active, or Bluetooth not enabled in this build.
  /bluetoothresults:
    get:
      summary: Get discovered Bluetooth devices.
      description: Returns the devices found so far by the scan started via GET /bluetoothscan.
      responses:
        "200":
          description: Successful response with discovered devices.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    address:
                      type: string
                      description: "MAC address, formatted as XX:XX:XX:XX:XX:XX."
                    rssi:
                      type: integer
        "400":
          description: Bluetooth not enabled in this build.
  /bluetoothconnect:
    post:
      summary: Connect to a Bluetooth device.
      description: >-
        Connects to the Bluetooth device with the given address. Only
        available in Bluetooth source mode.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: string
                  description: "MAC address, formatted as XX:XX:XX:XX:XX:XX."
              required:
                - address
      responses:
        "200":
          description: Connection attempt started.
        "400":
          description: Bluetooth source mode not active, or Bluetooth not enabled in this build.
  /info:
    get:
      summary: Get common information.
      description: Returns a JSON object with common information about ESPuino.
      responses:
        "200":
          description: Successful response with common information.
          content:
            application/json:
              schema:
                type: object
                # Include your common information properties here.
                additionalProperties: true
  /coredump:
    get:
      tags: [Fork]
      summary: Download the stored ESP-IDF ELF core dump.
      description: Requires the normal web session or X-API-Key authentication.
      responses:
        "200":
          description: Stored ELF core-dump image.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: No core dump is stored.
    delete:
      tags: [Fork]
      summary: Erase the stored core dump.
      description: Requires the normal web session or X-API-Key authentication.
      responses:
        "200":
          description: Core dump erased.
        "500":
          description: Erasing the core-dump partition failed.
  /log:
    get:
      summary: Get current log.
      description: Returns the current log as text.
      responses:
        "200":
          description: Successful response with log text.
          content:
            text/plain:
              schema:
                type: string
  /stats:
    get:
      summary: Get task runtime information.
      description: Returns an HTML webpage with task runtime information.
      responses:
        "200":
          description: Successful response with task runtime information.
          content:
            text/html:
              schema:
                type: string
  /stats.csv:
    get:
      summary: Export listening statistics as CSV.
      description: >
        Returns the daily listening-time statistics as a CSV download
        (header `date,seconds`), one row per calendar day from the first day
        with any playback up to the most recent tracked day (oldest first).
      responses:
        "200":
          description: CSV with one `date,seconds` row per day.
          content:
            text/csv:
              schema:
                type: string
  /debug:
    get:
      summary: Get debug information.
      description: Returns task runtime and debug information as JSON.
      responses:
        "200":
          description: Successful response with debug information.
          content:
            application/json:
              schema:
                type: object
                # Include your debug information properties here.
                additionalProperties: true
  /upload:
    post:
      summary: Upload NVS backup.
      description: Uploads a NVS backup file.
      responses:
        "200":
          description: Successful response for NVS backup upload.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
  /update:
    post:
      summary: Upload new firmware.
      description: Uploads new firmware to ESPuino. Make sure to restart afterwards.
      responses:
        "200":
          description: Successful response for firmware update.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                firmwareUpload:
                  type: string
                  format: binary
  /restart:
    post:
      summary: Restart ESPuino.
      description: Performs a restart of ESPuino. No parameters required.
      responses:
        "200":
          description: Successful response for ESPuino restart.
  /shutdown:
    post:
      summary: Shutdown ESPuino.
      description: Performs a shutdown (deep-sleep) of ESPuino. No parameters required.
      responses:
        "200":
          description: Successful response for ESPuino shutdown.
  /rfidnvserase:
    post:
      summary: Erase RFID assignments from NVS.
      description: Erases all RFID assignments from NVS.
      responses:
        "200":
          description: Successful response for RFID assignments erasure.
  /wifiscan:
    get:
      summary: Get nearby WiFi networks.
      description: >-
        Get a list of available nearby WiFi networks. The first request will
        return 0 results unless you start the scan from somewhere else
        (loop/setup). Do not request more often than 3-5 seconds!
      responses:
        "200":
          description: Successful response with nearby WiFi networks.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /trackprogress:
    get:
      summary: Get current track progress.
      description: "Get current track progress, time, and duration."
      responses:
        "200":
          description: Successful response with track progress information.
          content:
            application/json:
              schema:
                type: object
                # Include your track progress information properties here.
                additionalProperties: true
  /inithalleffectsensor:
    get:
      summary: Initialize Hall Effect Sensor Value.
      description: Initializes the Hall Effect Sensor Value.
      responses:
        "200":
          description: Successful response for initializing Hall Effect Sensor Value.
  # ----------------------------------------------------------------------------
  # Fork-specific endpoints (Leo Industries AT-1)
  # ----------------------------------------------------------------------------
  /sync:
    get:
      tags: [Fork]
      summary: Get HTTP file-sync status.
      description: Poll the progress/result of the HTTP(S) file sync.
      responses:
        "200":
          description: Current sync state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: "0=idle, 1=syncing, 2=done, 3=failed, 4=stopped"
                  progress:
                    type: integer
                    description: Percent of files processed.
                  message:
                    type: string
                    description: >-
                      Current file (while syncing) or the result/error message.
                      The summary includes a deleted count when mirror mode is on,
                      and a "dry run: ..." prefix after a dry run.
    post:
      tags: [Fork]
      summary: Start an HTTP file sync.
      description: >-
        Starts a background sync that pulls the files listed in the configured
        manifest URL onto the SD card. No-op if a sync is already running. If
        audio is playing it is paused for the SD-writing phase. When mirror mode
        is enabled (sync setting "deleteRemoved"), local files that the manifest
        no longer lists are deleted after the download pass; hidden/system and
        firmware-managed files (manifest.json, stats.csv, backup.txt) are kept,
        and the pass is skipped if the manifest failed to load or was empty.
        With the query parameter dry=1 it runs a dry run instead: nothing is
        downloaded or deleted and a report of what a real sync would do is
        written to the SD card (retrieve it via GET /syncreport).
      parameters:
        - name: dry
          in: query
          required: false
          description: If present (e.g. dry=1), run a dry run instead of a real sync.
          schema:
            type: integer
      responses:
        "200":
          description: Sync started (or already running).
  /syncstop:
    post:
      tags: [Fork]
      summary: Stop the running file sync.
      description: Requests a cooperative cancel of the currently running sync (also stops a dry run).
      responses:
        "200":
          description: Stop requested.
  /syncreport:
    get:
      tags: [Fork]
      summary: Get the last dry-run report.
      description: >-
        Returns the plain-text report written by the most recent file-sync dry
        run (POST /sync?dry=1): "DL new/chg <path>" lines for files a real sync
        would download and "RM <path>" lines for files mirror mode would delete,
        followed by a summary line.
      responses:
        "200":
          description: The dry-run report (text/plain).
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: No dry-run report exists yet.
        "409":
          description: A sync is still running; the report is not ready yet.
  /currenttrack:
    get:
      tags: [Fork]
      summary: Get details about the currently playing track.
      description: >-
        ID3 title/artist/album, file path + size, play mode, track x/y,
        position/duration, codec/bitrate/samplerate/channels and the RFID tag
        that started the playlist. Computed on demand (kept out of the websocket).
      responses:
        "200":
          description: Now-playing details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  active: { type: boolean }
                  title: { type: string }
                  artist: { type: string }
                  album: { type: string }
                  playMode: { type: integer }
                  isWebstream: { type: boolean }
                  rfidTag: { type: string }
                  elapsed: { type: integer }
                  duration: { type: integer }
                  bitRate: { type: integer }
                  sampleRate: { type: integer }
                  channels: { type: integer }
                  codec: { type: string }
                  trackNumber: { type: integer }
                  totalTracks: { type: integer }
                  path: { type: string }
                  size: { type: integer }
  /playstats:
    get:
      tags: [Fork]
      summary: Get the listening-statistics ring buffer.
      description: Daily listening seconds (for backup/restore and the 30-day chart).
      responses:
        "200":
          description: The ring buffer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  lastDay: { type: integer, description: Days since epoch of the newest slot. }
                  days:
                    type: array
                    items: { type: integer }
    post:
      tags: [Fork]
      summary: Restore the listening-statistics ring buffer.
      description: Restores the ring buffer from a previously fetched backup.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                lastDay: { type: integer }
                days:
                  type: array
                  items: { type: integer }
      responses:
        "200":
          description: Restored.
  /topcards:
    get:
      tags: [Fork]
      summary: Get the most-played RFID cards.
      description: Top 10 cards by play count, with their assigned file/URL and play mode.
      responses:
        "200":
          description: Ranked list of cards.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    count: { type: integer }
                    fileOrUrl: { type: string }
                    mode: { type: integer }
  /rfidsync:
    get:
      tags: [Fork]
      summary: Get RFID-tag sync status.
      description: Poll the progress/result of the bidirectional RFID-tag sync (server + peers).
      responses:
        "200":
          description: Current RFID-sync state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: "0=idle, 1=running, 2=done, 3=failed"
                  message:
                    type: string
                    description: Result or error message.
    post:
      tags: [Fork]
      summary: Trigger a full bidirectional RFID-tag sync.
      description: >-
        Pulls the server's tag list and merges it (newest-wins by timestamp), then
        pushes every local tag to the server and to all configured peers. No-op if
        a sync is already running.
      responses:
        "200":
          description: Sync started (or already running).
  /homekit:
    get:
      tags: [Fork]
      summary: Get HomeKit status + configurable names.
      description: HomeKit on/off state, pairing status, setup code and the device/TV names.
      responses:
        "200":
          description: HomeKit status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  active: { type: boolean }
                  paired: { type: boolean }
                  code: { type: string }
                  deviceName: { type: string }
                  tvName: { type: string }
  /homekit/enable:
    post:
      tags: [Fork]
      summary: Enable or disable HomeKit (applied on next reboot).
      parameters:
        - name: enabled
          in: query
          required: true
          description: "true to enable, anything else to disable."
          schema:
            type: boolean
      responses:
        "200":
          description: Stored.
  /homekit/reset:
    post:
      tags: [Fork]
      summary: Remove all HomeKit pairings.
      responses:
        "200":
          description: Pairings removed.
  /homekit/regencode:
    post:
      tags: [Fork]
      summary: Generate a fresh random HomeKit pairing code.
      responses:
        "200":
          description: New code generated.
  /homekit/qr.svg:
    get:
      tags: [Fork]
      summary: Get the HomeKit pairing QR code as an SVG.
      responses:
        "200":
          description: Pairing QR code.
          content:
            image/svg+xml:
              schema:
                type: string
  /rtc/resync:
    post:
      tags: [Fork]
      summary: Write the system time into the battery-backed RTC.
      description: >-
        Persists the current (NTP-disciplined) system time into the DS3231 so it
        survives a power loss. Only available when an RTC is present (RTC_ENABLE).
      responses:
        "200":
          description: RTC updated.
        "409":
          description: No RTC present.
  /rtc/settime:
    post:
      tags: [Fork]
      summary: Set the clock from a supplied UTC time.
      description: >-
        Sets the system clock (and the RTC, if present) from a UTC unix-time.
        Intended for offline devices without WiFi/NTP, e.g. setting the time from
        the browser. Only available when RTC_ENABLE is set.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                epoch:
                  type: integer
                  description: UTC unix-time in seconds (must be >= 2024-01-01).
              required: [epoch]
      responses:
        "200":
          description: Clock set.
        "400":
          description: Missing or implausible timestamp.
  /backupupload:
    get:
      tags: [Fork]
      summary: Get configuration-backup upload status.
      description: Poll the progress/result of the backup upload to the server.
      responses:
        "200":
          description: Current backup state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: "0=idle, 1=running, 2=done, 3=failed"
                  message:
                    type: string
                    description: Result or error message.
    post:
      tags: [Fork]
      summary: Upload a configuration backup to the server.
      description: >-
        Assembles the full configuration backup (settings + RFID assignments +
        per-path EQ rules + listening statistics, never any passwords) on the SD
        card and uploads it to the configured backup URL via HTTP POST, reusing
        the file-sync credentials. No-op if an upload is already running. Also
        bindable as command 189 or MQTT topic "backup".
      responses:
        "200":
          description: Upload started (or already running).
  /playlist:
    post:
      tags: [Fork]
      summary: Create an .m3u playlist.
      description: >-
        Writes an .m3u playlist to the SD card from the given ordered list of
        SD-file paths and/or webradio URLs (played interchangeably by LOCAL_M3U).
        The target is restricted to a single file below /Playlists and is replaced
        through a temporary file, so a short SD write does not truncate the previous playlist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, tracks]
              properties:
                path:
                  type: string
                  maxLength: 240
                  description: Target path directly below /Playlists; ".m3u" is appended if neither .m3u nor .m3u8 is present (e.g. /Playlists/mix).
                tracks:
                  type: array
                  minItems: 1
                  maxItems: 4096
                  items:
                    type: string
                    maxLength: 2048
                  description: Ordered track lines (SD paths or http(s) URLs).
      responses:
        "200":
          description: Playlist created.
        "400":
          description: Invalid path, empty/oversized track list, or invalid track line.
        "500":
          description: File could not be created.
        "507":
          description: The SD card could not store the complete playlist.
  /githubupdate:
    get:
      tags: [Fork]
      summary: Get GitHub OTA status.
      description: Poll the status of the GitHub firmware update.
      responses:
        "200":
          description: Current update status.
    post:
      tags: [Fork]
      summary: Start a GitHub OTA update.
      description: Downloads the rolling "latest" firmware from GitHub over HTTPS and flashes it.
      responses:
        "200":
          description: Update started.
  /version:
    get:
      tags: [Fork]
      summary: Get firmware version info.
      description: Returns the running build/rolling version and whether an update is available.
      responses:
        "200":
          description: Version info.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /security:
    get:
      tags: [Fork]
      summary: Password-protection status and session-cookie lifetime.
      responses:
        "200":
          description: Whether a web password is set, plus the cookie lifetime in days (0 = unlimited).
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  cookieDays:
                    type: integer
                    description: Session-cookie lifetime in days; 0 means unlimited.
    post:
      tags: [Fork]
      summary: Set the shared device password and/or the session-cookie lifetime.
      description: >
        Sets one shared password that protects the web interface, FTP and WebDAV at once
        (applied live, no reboot). An empty password is accepted and disables protection
        for all three. Both fields are optional: send only "cookieDays" to change the
        session-cookie lifetime without touching the password. If "password" is omitted the
        password is left unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                cookieDays:
                  type: integer
                  description: Session-cookie lifetime in days; 0 means unlimited.
      responses:
        "200":
          description: Settings updated.
  /login:
    post:
      tags: [Fork]
      summary: Log in to the web interface.
      description: >-
        Validates the password and sets the ESPUINO_SESSION cookie used to
        authenticate all subsequent requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
      responses:
        "200":
          description: Login successful; session cookie set.
        "401":
          description: Wrong password.
        "429":
          description: Temporarily locked after too many failed attempts.
  /logout:
    post:
      tags: [Fork]
      summary: Log out of the web interface.
      description: Clears the ESPUINO_SESSION cookie.
      responses:
        "200":
          description: Logged out.
  /eqrules:
    get:
      tags: [Fork]
      summary: List per-file/folder equalizer rules.
      responses:
        "200":
          description: Equalizer rules.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
  /eqrule:
    post:
      tags: [Fork]
      summary: Set a per-path equalizer rule.
      parameters:
        - in: query
          name: path
          required: true
          schema:
            type: string
          description: SD path (file or folder) the rule applies to.
        - in: query
          name: low
          schema:
            type: integer
        - in: query
          name: band
          schema:
            type: integer
        - in: query
          name: high
          schema:
            type: integer
        - in: query
          name: profile
          schema:
            type: string
          description: "Profile name (flat/music/speech/voiceBoost) or empty for custom bands."
      responses:
        "200":
          description: Rule stored.
        "413":
          description: "Rule store is full (NVS ~4 KB limit). Body: {\"error\":\"eqRulesFull\",\"used\":N,\"max\":N}. Delete existing rules first."
        "500":
          description: Saving to NVS failed.
    delete:
      tags: [Fork]
      summary: Delete a per-path equalizer rule.
      parameters:
        - in: query
          name: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rule deleted.
  /activeequalizer:
    get:
      tags: [Fork]
      summary: Get the active equalizer profile.
      responses:
        "200":
          description: Active equalizer settings.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /bluetoothscan:
    get:
      tags: [Fork]
      summary: Start a Bluetooth device scan.
      responses:
        "200":
          description: Scan started.
  /bluetoothresults:
    get:
      tags: [Fork]
      summary: Get Bluetooth scan results.
      responses:
        "200":
          description: Discovered devices.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /bluetoothconnect:
    post:
      tags: [Fork]
      summary: Connect to a Bluetooth device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Connect requested.
  /sdclean:
    post:
      tags: [Fork]
      summary: Clean the SD card cache.
      description: Removes ESPuino's cached playlist/index files from the SD card.
      responses:
        "200":
          description: Cleaned.
