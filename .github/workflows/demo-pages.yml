name: Deploy project page + Web-UI demo to GitHub Pages

# Builds the GitHub-Pages site: the project landing page at the root and, under
# /demo/, a self-contained device-free build of the management web interface
# (mock WebSocket + REST, copyright-free content) so the UI can be tried out in
# the browser without any hardware.

on:
  push:
    branches: [master]
    paths:
      - "html/**"
      - "docs/img/**"
      - "tools/demo/**"
      - "tools/build_demo.py"
      - ".github/workflows/demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, don't cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Build site
        run: python3 tools/build_demo.py demo_dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: demo_dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
