<!DOCTYPE html>
<html lang="de">

<head>
	<title data-i18n="wifi.title"></title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=300, initial-scale=1.0">
	<meta name="theme-color" content="#05070d">
	<script src="/js/vendor.min.js"></script>
	<style>
		/* ESPuino cyberpunk theme - self-contained (AP mode has no internet) */
		:root {
			--cp-cyan: #00f0ff;
			--cp-magenta: #ff2a6d;
			--cp-bg: #05070d;
			--cp-panel: #0a101e;
			--cp-surface: #0e1626;
			--cp-border: #1e2c4a;
			--cp-text: #c5d4f2;
			--cp-dim: #67779c;
		}

		/* match the main UI's monospace font; served locally, falls back in AP mode */
		@font-face {
			font-family: 'Share Tech Mono';
			font-style: normal;
			font-weight: 400;
			font-display: swap;
			src: url(/fonts/sharetechmono-400-latin-J7aHnp1uDWRBEqV98dVQztYldFcLowEF.woff2) format('woff2');
		}

		body {
			background-color: var(--cp-bg);
			background-image:
				radial-gradient(700px 360px at 50% -10%, rgba(0, 240, 255, .08), transparent 70%),
				linear-gradient(rgba(0, 240, 255, .03) 1px, transparent 1px),
				linear-gradient(90deg, rgba(0, 240, 255, .03) 1px, transparent 1px);
			background-size: auto, 44px 44px, 44px 44px;
			background-attachment: fixed;
			font-family: "Share Tech Mono", "Lucida Console", Monaco, monospace;
			font-size: 14px;
			color: var(--cp-text);
		}

		/* CRT scanline overlay */
		body::after {
			content: "";
			position: fixed;
			inset: 0;
			pointer-events: none;
			background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .16) 0px, rgba(0, 0, 0, .16) 1px, transparent 1px, transparent 3px);
			opacity: .28;
		}

		::selection {
			background: var(--cp-magenta);
			color: #fff;
		}

		h1 {
			font-size: 16px;
			text-transform: uppercase;
			letter-spacing: .18em;
			color: var(--cp-cyan);
			text-shadow: 0 0 12px rgba(0, 240, 255, .6);
			border-bottom: 1px solid var(--cp-border);
			padding-bottom: 10px;
		}

		h1::before {
			content: "// ";
			color: var(--cp-magenta);
		}

		.box {
			position: relative;
			background: linear-gradient(180deg, rgba(0, 240, 255, .045), rgba(0, 240, 255, 0) 120px), var(--cp-panel);
			border: 1px solid var(--cp-border);
			max-width: 258px;
			margin: 40px auto;
			padding: 30px;
			text-align: center;
			clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 0 100%);
		}

		.box::before {
			content: "";
			position: absolute;
			top: 0;
			right: 0;
			width: 18px;
			height: 18px;
			background: linear-gradient(to bottom right, transparent calc(50% - 1px), var(--cp-cyan) 50%, transparent calc(50% + 1px));
		}

		label {
			color: var(--cp-dim);
		}

		input {
			width: 90%;
			height: 44px;
			border-radius: 0;
			margin: 10px auto;
			font-size: 15px;
			font-family: inherit;
			background: var(--cp-surface);
			border: 1px solid var(--cp-border);
			color: var(--cp-text);
			padding: 0 15px;
			box-sizing: border-box;
		}

		input:focus {
			outline: none;
			border-color: var(--cp-cyan);
			box-shadow: 0 0 0 2px rgba(0, 240, 255, .15), 0 0 12px rgba(0, 240, 255, .25);
		}

		input[type="checkbox"] {
			width: 20px;
			height: 20px;
			accent-color: var(--cp-cyan);
		}

		.btn {
			background: rgba(0, 240, 255, .08);
			border: 1px solid rgba(0, 240, 255, .55);
			color: var(--cp-cyan);
			cursor: pointer;
			width: 90% !important;
			height: 44px;
			margin: 10px auto;
			font-size: 15px;
			font-family: inherit;
			text-transform: uppercase;
			letter-spacing: .08em;
			clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
			box-shadow: inset 0 0 12px rgba(0, 240, 255, .12);
		}

		/* hover-only: on touch screens :hover sticks after a tap (no mouse-leave),
		   leaving the control stuck in its highlight state */
		@media (hover: hover) {
			.btn:hover {
				background: var(--cp-cyan);
				color: #021019;
				box-shadow: inset 0 0 18px rgba(0, 240, 255, .3);
			}
		}

		/* scanned network list */
		.ssid {
			display: flex;
			align-items: center;
			gap: 10px;
			margin: 6px 0;
			padding: 8px 10px;
			border: 1px solid var(--cp-border);
			background: var(--cp-surface);
			cursor: pointer;
			text-align: left;
		}

		@media (hover: hover) {
			.ssid:hover {
				border-color: var(--cp-cyan);
				box-shadow: 0 0 10px rgba(0, 240, 255, .25);
			}
		}

		.ssid .name {
			flex: 1;
			color: var(--cp-cyan);
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		.ssid .ico {
			flex: none;
			display: inline-block;
			width: 24px;
			height: 24px;
			background-repeat: no-repeat;
			background-position: center;
			/* the embedded SVGs are gray/black - invert them for the dark theme */
			filter: invert(1) drop-shadow(0 0 3px rgba(0, 240, 255, .8));
		}

		.w1 {

<body>
	<form id="settings" action="#wifiConfig" class="box" method="POST" onsubmit="wifiConfig(); return false">
		<div style="text-align:right">
			<select id="langSel" style="width:auto;height:28px;margin:0;padding:0 5px;font-size:13px">
				<option value="de">Deutsch</option>
				<option value="en">English</option>
				<option value="fr">Français</option>
			</select>
		</div>
		<h1 data-i18n="wifi.title"></h1>
		<div id="connstatus" style="display:none;background:#f8d7da;color:#721c24;border-radius:4px;padding:10px;margin:10px 0;text-align:left"></div>
		<div id="WiFiList"></div>
		<label for="ssid" data-i18n="wifi.ssid.title"></label>: <br>
		<input type="text" id="ssid" name="ssid" placeholder="SSID" required>
		<br>
		<label for="pwd" data-i18n="wifi.password.title"></label>: <br>
		<input type="password" id="pwd" name="pwd" autocomplete="off" required>
		<br>
		<label for="hostname" data-i18n="wifi.hostname.title"></label>: <br>
		<input type="text" id="hostname" name="hostname" value="espuino"
			pattern="^[0-9a-zA-Z][0-9a-zA-Z\-]{0,30}[0-9a-zA-Z]" required>
		<br>
		<br>
		<input type="checkbox" id="scan_wifi_on_start" name="scan_wifi_on_start" value="false">
		<label for="scan_wifi_on_start" data-i18n="wifi.scan.enabled"></label>
		<br>
		<br>
		<input type="checkbox" id="static_enabled" name="static_enabled" value="false">
		<label for="static_enabled" data-i18n="wifi.static.enabled"></label>
		<div id="wifi_static_div" style="display:none">
			<label for="static_addr" data-i18n="wifi.static.addr"></label>: <br>
			<input type="text" id="static_addr" name="static_addr">
			<br>
			<br>
			<label for="static_gateway" data-i18n="wifi.static.gateway"></label>: <br>
			<input type="text" id="static_gateway" name="static_gateway">
			<br>
			<br>
			<label for="static_subnet" data-i18n="wifi.static.subnet"></label>: <br>
			<input type="text" id="static_subnet" name="static_subnet">
			<br>
			<br>
			<label for="static_dns1" data-i18n="wifi.static.dns1"></label>: <br>
			<input type="text" id="static_dns1" name="static_dns1">
			<br>
			<br>
			<label for="static_dns2" data-i18n="wifi.static.dns2"></label>: <br>
			<input type="text" id="static_dns2" name="static_dns2">
			<br>
			<br>
		</div>
		<button type="submit" class="btn" id="save-button" data-i18n="wifi.saveButton"></button>
	</form>
	<div id="teststatus" style="display:none;border-radius:4px;padding:10px;margin:0 auto 20px;max-width:500px;text-align:left"></div>
	<form id="restartform" action="/restart" method="POST" class="box">
		<h1 data-i18n="wifi.restartPrompt"></h1>
		<button type="submit" class="btn" id="restart-button" data-i18n="restart" value="Reboot"></button>
	</form>
	<div class="box">
		<h1 data-i18n="wifi.fullInterface.title"></h1>
		<p data-i18n="wifi.fullInterface.hint" style="font-size:13px;"></p>
		<input type="text" id="full-interface-url" readonly onclick="this.select(); this.setSelectionRange(0, 99999);">
		<button type="button" class="btn" id="copy-url-button" data-i18n="wifi.fullInterface.copy"></button>
		<div id="copy-url-status" style="min-height:20px; font-size:13px; color:#3498db;"></div>
	</div>
	<script>
		i18next.use(i18nextHttpBackend).init({
			backend: {
				loadPath: "/locales/{{lng}}.json"
			},
			debug: true,
			load: 'languageOnly',
			fallbackLng: 'en',
		}, (err, t) => {
			localize = locI18next.init(i18next);
			// same language resolution as management.html: explicit choice from
			// localStorage first, browser language otherwise
			const lang = localStorage.getItem("language");
			i18next.changeLanguage(lang !== null ? lang : navigator.language.split("-")[0]);
		});
		i18next.on('languageChanged', (lng) => {
			document.querySelector('#langSel').value = lng;
			document.documentElement.lang = lng;
			document.title = i18next.t('wifi.title');
			if (typeof localize === "function") {
				localize('body');
			}
			// the failure banner is built with i18next.t(), so it has to be
			// re-rendered whenever the language changes
			renderWifiStatus();
		});
		document.querySelector('#langSel').addEventListener('change', (event) => {
			const lang = event.target.value;
			if (lang !== i18next.language) {
				localStorage.setItem("language", lang);
				i18next.changeLanguage(lang);
			}
		});

		let wifiStatusData = null;
		function renderWifiStatus() {
			const box = document.getElementById("connstatus");
			const failure = wifiStatusData && wifiStatusData.last_failure;
			if (!failure || !i18next.isInitialized) {
				box.style.display = "none";
				return;
			}
			const cls = ["wrong_password", "not_found", "rejected"].includes(failure.class) ? failure.class : "other";
			box.innerText = i18next.t("wifi.fail." + cls, { ssid: failure.ssid, code: failure.reason });
			box.style.display = "block";
		}
		async function getWifiStatus() {
			try {
				wifiStatusData = await (await fetch("/wifistatus")).json();
				renderWifiStatus();
			} catch (error) {
				console.log(error);
			}
		}
		function selectWiFi(ssid) {
			document.getElementById("ssid").value = ssid;
			document.getElementById("pwd").focus();
		}
		async function getWiFiList() {
			try {
				const response = await fetch("/wifiscan");
				const data = await response.json();
				listWiFi(data);
			} catch (error) {
				console.log(error);
				setTimeout(getWiFiList, 5000);
			}
		}

		function listWiFi(data) {
			var list = document.getElementById("WiFiList");
			// Build the list via DOM nodes + textContent, never innerHTML: the SSID/BSSID are fully
			// attacker-controlled (any nearby AP can broadcast a crafted 32-byte SSID), so string
			// interpolation here would be DOM-based XSS on the page that takes the WiFi password.
			list.textContent = "";
			data.forEach(function (WiFis) {
				var row = document.createElement("div");
				row.className = "ssid";
				row.title = WiFis.quality + "% (" + WiFis.rssi + " dBm) " + (WiFis.bssid || "");
				row.addEventListener("click", function () { selectWiFi(WiFis.ssid); });
				var wico = document.createElement("span");
				wico.className = "ico " + WiFis.wico;
				var name = document.createElement("span");
				name.className = "name";
				name.textContent = WiFis.ssid;
				var pico = document.createElement("span");
				pico.className = "ico " + WiFis.pico;
				row.appendChild(wico);
				row.appendChild(name);
				row.appendChild(pico);
				list.appendChild(row);
			});
			setTimeout(getWiFiList, 5000);
		}
		// disable static input fields on toggle
		document.getElementById('static_enabled').onchange = function () {
			let new_style = this.checked ? null : "none";
			document.getElementById("wifi_static_div").style.display = new_style;
		};
		// live connection test: kicked off after saving, result shown in-page
		const testStatusColors = {
			progress: ["#cce5ff", "#004085"],
			success: ["#d4edda", "#155724"],
			failed: ["#f8d7da", "#721c24"]
		};
		let lastTestState = null;
		function showTestStatus(kind, text) {
			lastTestState = { kind: kind, text: text };
			const box = document.getElementById("teststatus");
			box.style.background = testStatusColors[kind][0];
			box.style.color = testStatusColors[kind][1];
			box.innerText = text;
			box.style.display = "block";
		}
		// Disable the form and turn the Connect button into a "Connecting …"
		// indicator while a live test is in flight, so it's obvious the box is
		// working (the button is where the eye already is). Re-enabled on failure
		// so the user can fix the credentials and retry.
		function setFormBusy(busy) {
			const form = document.getElementById("settings");
			for (const el of form.elements) {
				el.disabled = busy;
			}
			const btn = document.getElementById("save-button");
			btn.innerText = busy ? i18next.t("wifi.test.connectingBtn") : i18next.t("wifi.saveButton");
		}
		async function pollTestStatus() {
			try {
				const data = await (await fetch("/wifistatus")).json();
				if (data.test) {
					const t = data.test;
					if (t.phase === "success") {
						document.getElementById("settings").style.display = "none";
						document.getElementById("restartform").style.display = "none";
						retargetFullInterfaceCard(t.ip);
						showTestStatus("success", i18next.t("wifi.test.success", { ssid: t.ssid, ip: t.ip }));
						return;
					}
					if (t.phase === "failed") {
						setFormBusy(false);
						const cls = ["wrong_password", "not_found", "rejected", "timeout"].includes(t.class) ? t.class : "other";
						showTestStatus("failed", i18next.t("wifi.fail." + cls, { ssid: t.ssid, code: t.reason }));
						return;
					}
					showTestStatus("progress", i18next.t("wifi.test.connecting", { ssid: t.ssid }));
				}
			} catch (error) {
				// expected while the AP hops to the target network's channel
				console.log(error);
			}
			setTimeout(pollTestStatus, 1500);
		}
		async function wifiConfig() {
			setFormBusy(true);
			let static = document.getElementById('static_enabled').checked;
			const ssid = document.getElementById('ssid').value;
			var myObj = {
				ssid: ssid,
				pwd: document.getElementById('pwd').value,
				static: static
			};
			if (static) {
				myObj = {
					...myObj,
					static_addr: document.getElementById('static_addr').value,
					static_gateway: document.getElementById('static_gateway').value,
					static_subnet: document.getElementById('static_subnet').value,
					static_dns1: document.getElementById('static_dns1').value,
					static_dns2: document.getElementById('static_dns2').value,
				};
			}
			await fetch("/savedSSIDs", {
				method: "POST",
				headers: {
					"Content-Type": "application/json"
				},
				body: JSON.stringify(myObj)
			});
			var myObj = {
				hostname: document.getElementById('hostname').value,
				scanOnStart: document.getElementById('scan_wifi_on_start').checked
			};
			await fetch("/wificonfig", {
				method: "POST",
				headers: {
					"Content-Type": "application/json"
				},
				body: JSON.stringify(myObj)
			});
			// try the credentials right away, while the AP stays up
			document.getElementById("connstatus").style.display = "none";
			const response = await fetch("/wifitest", {
				method: "POST",
				headers: {
					"Content-Type": "application/json"
				},
				body: JSON.stringify({ ssid: ssid })
			});
			if (response.ok) {
				showTestStatus("progress", i18next.t("wifi.test.connecting", { ssid: ssid }));
				setTimeout(pollTestStatus, 1000);
			} else {
				setFormBusy(false);
				showTestStatus("failed", i18next.t("wifi.fail.other", { ssid: ssid, code: 0 }));
			}
		}
		addEventListener("DOMContentLoaded", (event) => {
			getWiFiList();
			updateWifiFields();
			setupFullInterfaceLink();
			getWifiStatus();
		});

		// Show the full management interface's URL and offer a "copy to clipboard" button. Uses the
		// legacy execCommand('copy') rather than navigator.clipboard.writeText(), since the latter
		// requires a secure (HTTPS) context and ESPuino only serves plain HTTP. Whether this works inside
		// the OS's captive-portal sandbox (vs. a regular browser) is untested - so the URL always stays
		// visible/selectable as a reliable fallback regardless of whether the copy itself succeeds.
		//
		// Deliberately hardcoded rather than derived from location.host: while in the captive-portal flow,
		// the browser's address bar (and location.host) shows whatever probe hostname the OS resolved
		// through ESPuino's catch-all DNS (e.g. macOS/iOS use "captive.apple.com"), not the device's actual
		// IP. Copying a URL built from that would produce a link that resolves to the real apple.com (or
		// whichever host) once opened outside the captive session - not back to ESPuino. The AP's IP is a
		// fixed constant (see apIP in Wlan.cpp), so hardcoding it here is the robust choice.
		// A successful test closes the AP moments later, which kills the 192.168.4.1
		// address this card advertises — and the card's premise ("skip WiFi setup")
		// no longer applies either. Repoint it at the address the box just obtained
		// and relabel it, so the copy button hands the user a link that still works
		// once the setup network is gone.
		function retargetFullInterfaceCard(ip) {
			document.getElementById("full-interface-url").value = `http://${ip}/management.html`;
			const title = document.querySelector('[data-i18n="wifi.fullInterface.title"]');
			const hint = document.querySelector('[data-i18n="wifi.fullInterface.hint"]');
			if (title) {
				title.setAttribute("data-i18n", "wifi.test.reachTitle");
			}
			if (hint) {
				hint.setAttribute("data-i18n", "wifi.test.reachHint");
			}
			if (typeof localize === "function") {
				localize('body');
			}
		}
		function setupFullInterfaceLink() {
			const urlField = document.getElementById("full-interface-url");
			urlField.value = "http://192.168.4.1/management.html";

			document.getElementById("copy-url-button").addEventListener("click", () => {
				const status = document.getElementById("copy-url-status");
				urlField.select();
				urlField.setSelectionRange(0, 99999);
				let copied = false;
				try {
					copied = document.execCommand("copy");
				} catch (error) {
					copied = false;
				}
				status.textContent = i18next.t(copied ? "wifi.fullInterface.copied" : "wifi.fullInterface.copyFailed");
			});
		}
		async function updateWifiFields() {
			let hostnameElem = document.getElementById("hostname");
			let scanWifiElem = document.getElementById("scan_wifi_on_start");
			let config = await (await fetch("/wificonfig")).json();
			if (config.hostname && config.hostname !== "") {
				hostnameElem.value = config.hostname;
				hostnameElem.defaultValue = config.hostname;
			}
			scanWifiElem.checked = config.scanOnStart;
		}
	</script>
</body>
